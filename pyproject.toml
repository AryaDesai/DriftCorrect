[project]
name = "driftcorrect"
version = "0.1.0"
description = "Microscopy movie alignment and drift correction"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "tifffile>=2024.1.30",
    "nd2>=0.10",
    "pyyaml>=6.0",
    "PyQt6>=6.6",
    "matplotlib>=3.8",
    "imageio-ffmpeg",
]

[project.optional-dependencies]
cuda12 = ["cupy-cuda12x[ctk]>=14; sys_platform == 'win32'"]
cuda13 = ["cupy-cuda13x[ctk]>=14; sys_platform == 'win32'"]

[tool.uv]
package = false
conflicts = [[{ extra = "cuda12" }, { extra = "cuda13" }]]
